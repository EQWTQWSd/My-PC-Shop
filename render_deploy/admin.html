<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — My PC Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#06080f;--bg2:#0d1117;--bg3:#151b28;--bg4:#1c2435;
  --border:#1e2d45;--border2:#2a3a55;
  --text:#f0f4f8;--text2:#94a3b8;--text3:#5a6a80;
  --accent:#6366f1;--accent2:#818cf8;
  --green:#22c55e;--red:#ef4444;--orange:#f59e0b;
  --r:10px;--r2:14px;--t:0.2s ease;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}

/* LOGIN */
.login-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;
  background:radial-gradient(ellipse at 60% 40%,rgba(99,102,241,0.08),transparent 60%);
}
.login-box{
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:20px;padding:44px 40px;width:100%;max-width:400px;
  box-shadow:0 24px 60px rgba(0,0,0,0.5);
}
.login-logo{text-align:center;margin-bottom:32px;}
.login-logo .icon{font-size:40px;display:block;margin-bottom:12px;}
.login-logo h1{font-size:22px;font-weight:800;letter-spacing:-0.3px;}
.login-logo p{font-size:13px;color:var(--text3);margin-top:4px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.form-input{
  width:100%;padding:12px 16px;background:var(--bg2);
  border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);font-size:14px;font-family:inherit;transition:all var(--t);
}
.form-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,0.12);}
.btn-login{
  width:100%;padding:13px;background:var(--accent);border:none;
  border-radius:var(--r);color:#fff;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:all var(--t);margin-top:8px;
}
.btn-login:hover{background:#4f46e5;box-shadow:0 6px 20px rgba(99,102,241,0.35);}
.login-error{
  padding:12px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);
  border-radius:var(--r);color:var(--red);font-size:13px;text-align:center;
  margin-top:12px;display:none;
}

/* ADMIN LAYOUT */
.admin-layout{display:none;min-height:100vh;}
.admin-topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(13,17,23,0.85);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;height:60px;
}
.admin-brand{font-size:15px;font-weight:800;letter-spacing:0.5px;display:flex;align-items:center;gap:8px;}
.admin-brand .badge{
  font-size:10px;padding:3px 10px;border-radius:100px;
  background:rgba(99,102,241,0.15);color:var(--accent2);border:1px solid rgba(99,102,241,0.2);
  font-weight:700;letter-spacing:1px;
}
.topbar-right{display:flex;align-items:center;gap:12px;}
.user-pill{
  padding:6px 14px;border-radius:100px;background:var(--bg3);
  border:1px solid var(--border);font-size:13px;color:var(--text2);
}
.btn-logout{
  padding:7px 18px;border-radius:100px;
  background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);
  color:var(--red);font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:all var(--t);
}
.btn-logout:hover{background:rgba(239,68,68,0.2);}

.admin-body{max-width:1100px;margin:0 auto;padding:36px 28px 60px;}

/* Header */
.page-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:16px;}
.page-top h2{font-size:24px;font-weight:800;letter-spacing:-0.3px;}
.page-top p{font-size:13px;color:var(--text3);margin-top:4px;}
.btn-add{
  padding:10px 24px;border-radius:var(--r);
  background:var(--accent);border:none;color:#fff;
  font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:all var(--t);display:flex;align-items:center;gap:8px;
}
.btn-add:hover{background:#4f46e5;box-shadow:0 4px 16px rgba(99,102,241,0.3);}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.75);
  backdrop-filter:blur(6px);z-index:500;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-backdrop.open{display:flex;}
.modal-box{
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:20px;padding:32px;width:100%;max-width:520px;
  max-height:90vh;overflow-y:auto;
  box-shadow:0 32px 80px rgba(0,0,0,0.6);
  animation:slideUp 0.3s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.modal-title{font-size:18px;font-weight:800;}
.modal-close{
  width:32px;height:32px;border-radius:8px;background:var(--bg4);
  border:1px solid var(--border);color:var(--text2);font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--t);
}
.modal-close:hover{color:var(--red);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* Image upload */
.img-zone{
  border:2px dashed var(--border2);border-radius:var(--r2);
  padding:24px 16px;display:flex;align-items:center;justify-content:center;
  gap:16px;cursor:pointer;transition:all var(--t);background:var(--bg2);min-height:100px;
}
.img-zone:hover{border-color:var(--accent);background:rgba(99,102,241,0.04);}
.img-zone.has-img{border-style:solid;border-color:var(--accent);padding:12px;}
.img-zone img{width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex-shrink:0;}
.zone-text{font-size:13px;color:var(--text3);line-height:1.6;}
.zone-text small{font-size:11px;opacity:0.7;}
.zone-icon{font-size:28px;opacity:0.5;}

/* Buttons */
.btn-primary{
  padding:12px 28px;background:var(--accent);border:none;border-radius:var(--r);
  color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all var(--t);
}
.btn-primary:hover{background:#4f46e5;}
.btn-secondary{
  padding:10px 22px;background:transparent;border:1px solid var(--border);
  border-radius:var(--r);color:var(--text3);font-size:13px;font-weight:500;
  cursor:pointer;font-family:inherit;transition:all var(--t);
}
.btn-secondary:hover{background:var(--bg4);color:var(--text2);}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:1px solid var(--border);}

/* Credits grid */
.credits-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.credit-card{
  background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);
  padding:24px 20px;text-align:center;position:relative;transition:all var(--t);overflow:hidden;
}
.credit-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),#a855f7,var(--accent2));
  opacity:0;transition:opacity var(--t);
}
.credit-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 10px 30px rgba(99,102,241,0.12);}
.credit-card:hover::before{opacity:1;}
.card-avatar{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto 14px;display:block;border:3px solid var(--border2);box-shadow:0 4px 14px rgba(99,102,241,0.2);transition:all var(--t);}
.credit-card:hover .card-avatar{border-color:var(--accent);}
.card-avatar-placeholder{width:80px;height:80px;border-radius:50%;background:rgba(99,102,241,0.1);border:3px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px;}
.card-name{font-size:16px;font-weight:700;margin-bottom:4px;}
.card-role{display:inline-block;padding:4px 12px;border-radius:100px;background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.2);color:var(--accent2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;margin-bottom:8px;}
.card-stdid{font-size:12px;color:var(--text3);margin-bottom:8px;}
.card-desc{font-size:13px;color:var(--text2);line-height:1.6;}
.card-actions{display:flex;gap:8px;justify-content:center;margin-top:16px;}
.btn-edit{padding:7px 18px;border-radius:8px;background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.2);color:var(--accent2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all var(--t);}
.btn-edit:hover{background:rgba(99,102,241,0.2);}
.btn-del{padding:7px 18px;border-radius:8px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.15);color:var(--red);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all var(--t);}
.btn-del:hover{background:rgba(239,68,68,0.18);}

.empty-state{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--text3);}
.empty-state .ei{font-size:48px;display:block;margin-bottom:14px;opacity:0.4;}

.toast{
  position:fixed;bottom:28px;right:28px;z-index:1000;
  padding:14px 22px;border-radius:var(--r);font-size:13px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
  transform:translateY(20px);opacity:0;transition:all 0.3s ease;pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{background:#166534;color:#bbf7d0;border:1px solid #166534;}
.toast.error{background:#7f1d1d;color:#fecaca;border:1px solid #7f1d1d;}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:900px){.credits-grid{grid-template-columns:repeat(2,1fr);}.form-row{grid-template-columns:1fr;}}
@media(max-width:600px){.credits-grid{grid-template-columns:1fr;}.admin-topbar{padding:0 16px;}.admin-body{padding:20px 16px 40px;}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <span class="icon">🔐</span>
      <h1>Admin Panel</h1>
      <p>My PC Shop — เฉพาะผู้ดูแลระบบเท่านั้น</p>
    </div>
    <div class="form-group">
      <label>ชื่อผู้ใช้</label>
      <input type="text" class="form-input" id="inp-user" placeholder="username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>รหัสผ่าน</label>
      <input type="password" class="form-input" id="inp-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-login" onclick="doLogin()" id="login-btn">เข้าสู่ระบบ</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ADMIN LAYOUT -->
<div class="admin-layout" id="admin-layout">
  <header class="admin-topbar">
    <div class="admin-brand">
      🖥️ MY PC SHOP
      <span class="badge">ADMIN</span>
    </div>
    <div class="topbar-right">
      <span class="user-pill" id="user-pill">👤</span>
      <button class="btn-logout" onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </header>

  <div class="admin-body">
    <div class="page-top">
      <div>
        <h2>จัดการเครดิตนักพัฒนา</h2>
        <p>เพิ่ม แก้ไข หรือลบรายชื่อทีมนักพัฒนา</p>
      </div>
      <button class="btn-add" onclick="openModal()">
        <span>＋</span> เพิ่มเครดิต
      </button>
    </div>
    <div class="credits-grid" id="credits-grid">
      <div class="empty-state"><span class="ei">⏳</span>กำลังโหลด...</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title">เพิ่มเครดิต</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <input type="hidden" id="edit-id" value="">

    <div class="form-row">
      <div class="form-group">
        <label>ชื่อ-นามสกุล *</label>
        <input type="text" class="form-input" id="f-name" placeholder="สมชาย ใจดี">
      </div>
      <div class="form-group">
        <label>บทบาท / ตำแหน่ง *</label>
        <input type="text" class="form-input" id="f-role" placeholder="Frontend Developer">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>รหัสนักศึกษา / ID</label>
        <input type="text" class="form-input" id="f-stdid" placeholder="66-xxxxxx-x">
      </div>
      <div class="form-group">
        <label>คำอธิบาย / หน้าที่</label>
        <input type="text" class="form-input" id="f-desc" placeholder="รับผิดชอบ UI/UX...">
      </div>
    </div>
    <div class="form-group">
      <label>รูปภาพโปรไฟล์</label>
      <div class="img-zone" id="img-zone" onclick="document.getElementById('f-img').click()">
        <span class="zone-icon">📷</span>
        <span class="zone-text">คลิกเพื่อเลือกรูปภาพ<br><small>PNG, JPG, WEBP (ไม่เกิน 5MB)</small></span>
      </div>
      <input type="file" id="f-img" accept="image/*" style="display:none" onchange="previewImg(event)">
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-primary" id="save-btn" onclick="saveCredit()">💾 บันทึก</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentImage = '';
let credits = [];

async function checkAuth() {
  const res = await fetch('/api/admin/me');
  const data = await res.json();
  if (data.isAdmin) showAdmin(data.username);
}

async function doLogin() {
  const username = document.getElementById('inp-user').value.trim();
  const password = document.getElementById('inp-pass').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  if (!username || !password) { showLoginErr('กรุณากรอกข้อมูลให้ครบ'); return; }

  btn.innerHTML = '<span class="spinner"></span>กำลังเข้าสู่ระบบ...';
  btn.disabled = true;
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.ok) { showAdmin(data.username); }
    else { showLoginErr(data.error || 'เข้าสู่ระบบไม่สำเร็จ'); }
  } catch { showLoginErr('เกิดข้อผิดพลาด กรุณาลองใหม่'); }
  finally { btn.innerHTML = 'เข้าสู่ระบบ'; btn.disabled = false; }
}

function showLoginErr(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg; el.style.display = 'block';
}

function showAdmin(username) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-layout').style.display = 'block';
  document.getElementById('user-pill').textContent = '👤 ' + username;
  loadCredits();
}

async function doLogout() {
  await fetch('/api/admin/logout', { method: 'POST' });
  location.reload();
}

async function loadCredits() {
  const res = await fetch('/api/admin/credits');
  credits = await res.json();
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('credits-grid');
  if (!credits.length) {
    grid.innerHTML = '<div class="empty-state"><span class="ei">👥</span>ยังไม่มีเครดิต<br>กด <strong>เพิ่มเครดิต</strong> เพื่อเริ่มต้น</div>';
    return;
  }
  grid.innerHTML = credits.map(c => `
    <div class="credit-card">
      ${c.image
        ? `<img src="${c.image}" alt="${c.name}" class="card-avatar">`
        : `<div class="card-avatar-placeholder">👤</div>`}
      <div class="card-name">${c.name}</div>
      <div class="card-role">${c.role}</div>
      ${c.stdId ? `<div class="card-stdid">🎓 ${c.stdId}</div>` : ''}
      ${c.desc  ? `<div class="card-desc">${c.desc}</div>` : ''}
      <div class="card-actions">
        <button class="btn-edit" onclick="openModal(${c.id})">✏️ แก้ไข</button>
        <button class="btn-del"  onclick="deleteCredit(${c.id},'${c.name}')">🗑️ ลบ</button>
      </div>
    </div>`).join('');
}

function openModal(id) {
  const c = id ? credits.find(x => x.id === id) : null;
  document.getElementById('modal-title').textContent = c ? 'แก้ไขเครดิต' : 'เพิ่มเครดิต';
  document.getElementById('edit-id').value  = c ? c.id : '';
  document.getElementById('f-name').value   = c ? c.name  : '';
  document.getElementById('f-role').value   = c ? c.role  : '';
  document.getElementById('f-stdid').value  = c ? (c.stdId||'') : '';
  document.getElementById('f-desc').value   = c ? (c.desc||'')  : '';
  document.getElementById('f-img').value    = '';
  currentImage = c ? (c.image || '') : '';
  const zone = document.getElementById('img-zone');
  if (currentImage) {
    zone.classList.add('has-img');
    zone.innerHTML = `<img src="${currentImage}" alt="preview"><span class="zone-text">รูปปัจจุบัน<br><small>คลิกเพื่อเปลี่ยนรูป</small></span>`;
  } else {
    zone.classList.remove('has-img');
    zone.innerHTML = `<span class="zone-icon">📷</span><span class="zone-text">คลิกเพื่อเลือกรูปภาพ<br><small>PNG, JPG, WEBP (ไม่เกิน 5MB)</small></span>`;
  }
  document.getElementById('modal-backdrop').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 100);
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('open');
}

function previewImg(e) {
  const file = e.target.files[0];
  if (!file) return;
  const zone = document.getElementById('img-zone');
  const reader = new FileReader();
  reader.onload = ev => {
    currentImage = '';
    zone.classList.add('has-img');
    zone.innerHTML = `<img src="${ev.target.result}" alt="preview"><span class="zone-text">${file.name}<br><small>คลิกเพื่อเปลี่ยนรูป</small></span>`;
  };
  reader.readAsDataURL(file);
}

async function saveCredit() {
  const name  = document.getElementById('f-name').value.trim();
  const role  = document.getElementById('f-role').value.trim();
  if (!name || !role) { showToast('กรุณากรอกชื่อและบทบาท','error'); return; }

  const editId = document.getElementById('edit-id').value;
  const btn = document.getElementById('save-btn');
  btn.innerHTML = '<span class="spinner"></span>กำลังบันทึก...';
  btn.disabled = true;

  const fd = new FormData();
  fd.append('name',  name);
  fd.append('role',  role);
  fd.append('stdId', document.getElementById('f-stdid').value.trim());
  fd.append('desc',  document.getElementById('f-desc').value.trim());
  const imgFile = document.getElementById('f-img').files[0];
  if (imgFile) fd.append('avatar', imgFile);
  else if (currentImage) fd.append('imageUrl', currentImage);
  else fd.append('imageUrl', '');

  try {
    const url    = editId ? `/api/admin/credits/${editId}` : '/api/admin/credits';
    const method = editId ? 'PUT' : 'POST';
    const res = await fetch(url, { method, body: fd });
    const data = await res.json();
    if (data.ok) {
      showToast(editId ? 'แก้ไขเครดิตสำเร็จ' : 'เพิ่มเครดิตสำเร็จ', 'success');
      closeModal(); loadCredits();
    } else { showToast(data.error || 'เกิดข้อผิดพลาด','error'); }
  } catch { showToast('เชื่อมต่อ server ไม่ได้','error'); }
  finally { btn.innerHTML = '💾 บันทึก'; btn.disabled = false; }
}

async function deleteCredit(id, name) {
  if (!confirm(`ลบเครดิต "${name}" ออกใช่ไหม?`)) return;
  const res = await fetch(`/api/admin/credits/${id}`, { method: 'DELETE' });
  const data = await res.json();
  if (data.ok) { showToast('ลบเครดิตแล้ว','success'); loadCredits(); }
  else showToast(data.error || 'เกิดข้อผิดพลาด','error');
}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

document.getElementById('modal-backdrop').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

checkAuth();
</script>
</body>
</html>
